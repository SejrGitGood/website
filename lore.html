<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
<title>Lore &middot; Blessings of Valkyriegade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="css/styles.css?v=16">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A6461C">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valkyriegade">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<nav class="site-nav" id="site-nav"></nav>

<main>
  <div class="page-head">
    <p class="eyebrow">Historien</p>
    <h1>Lore</h1>
    <p>NPC'er, steder og begivenheder &mdash; alt det, ingen af os kan huske til næste session.</p>
  </div>

  <div class="wrap">
    <p style="margin:-8px 0 4px;"><a href="historien.html" class="back-link">&larr; Historien</a></p>

    <section class="section" id="addSection">
      <div class="section-title"><h2>Ny lore</h2></div>
      <div class="card">
        <form class="form" id="addForm">
          <div class="row">
            <div class="field" style="flex:2;">
              <label for="title">Titel</label>
              <input type="text" id="title" required placeholder="F.eks. Stanimir">
            </div>
            <div class="field" style="max-width:200px;">
              <label for="category">Kategori</label>
              <select id="category">
                <option value="NPC">NPC</option>
                <option value="Faction">Faction</option>
                <option value="Sted">Sted</option>
                <option value="Begivenhed">Begivenhed</option>
                <option value="Genstand">Genstand</option>
                <option value="Butik">Butik</option>
                <option value="Monster">Monster</option>
                <option value="Besværgelse">Besværgelse</option>
                <option value="Andet">Andet</option>
              </select>
            </div>
          </div>
          <div class="row" id="npcFieldsRow" hidden>
            <div class="field" style="max-width:220px;">
              <label for="relationship">Holdning</label>
              <select id="relationship">
                <option value="">Ikke sat</option>
                <option value="Fjendtlig">Fjendtlig</option>
                <option value="Uvenlig">Uvenlig</option>
                <option value="Ligegyldig">Ligegyldig</option>
                <option value="Venlig">Venlig</option>
                <option value="Hjælpsom">Hjælpsom</option>
              </select>
            </div>
            <div class="field" style="max-width:220px;">
              <label for="status">Status</label>
              <select id="status">
                <option value="">Ikke sat</option>
                <option value="Levende">Levende</option>
                <option value="Død">Død</option>
                <option value="Forsvundet">Forsvundet</option>
                <option value="Ukendt">Ukendt</option>
              </select>
            </div>
          </div>
          <div class="field" style="max-width:200px;">
            <label for="author">Hvem skriver?</label>
            <input type="text" id="author" list="authorNames" required placeholder="Dit navn">
            <datalist id="authorNames">
              <option value="Emil"></option>
              <option value="Jacob"></option>
              <option value="Markus"></option>
              <option value="Sejr"></option>
              <option value="Thomas"></option>
            </datalist>
          </div>
          <div class="field">
            <label for="body">Beskrivelse</label>
            <textarea id="body" required></textarea>
            <p class="paste-hint">Tip: klik i feltet og indsæt et billede med Ctrl+V &mdash; det lander der, hvor markøren står.</p>
          </div>
          <button class="btn" type="submit">Gem</button>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2 id="listTitle">Al lore</h2>
        <a href="lore.html" id="backLink" hidden>&larr; Se al lore</a>
        <div class="tabs" id="tabs">
          <button data-cat="all" class="active">Alle</button>
          <button data-cat="NPC">NPC</button>
          <button data-cat="Faction">Faction</button>
          <button data-cat="Sted">Sted</button>
          <button data-cat="Begivenhed">Begivenhed</button>
          <button data-cat="Genstand">Genstand</button>
          <button data-cat="Butik">Butik</button>
          <button data-cat="Monster">Monster</button>
          <button data-cat="Besværgelse">Besværgelse</button>
          <button data-cat="Andet">Andet</button>
        </div>
      </div>
      <div id="list"><div class="empty">Indlæser&hellip;</div></div>
    </section>
  </div>
</main>

<footer class="site-footer">Blessings of Valkyriegade &middot; skrevet af os, for os.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=1"></script>
<script src="js/app.js?v=16"></script>
<script src="js/shops.js?v=5"></script>
<script>
(async function () {
  const session = await guardPage();
  if (!session) return;
  renderNav("historien.html");
  wireLightbox();
  wireLoreMentionPreviews();

  const list = document.getElementById("list");
  const onlyId = new URLSearchParams(location.search).get("id");
  let activeCat = "all";
  let rowsCache = [];
  let loreIndex = [];

  if (onlyId) {
    document.getElementById("addSection").hidden = true;
    document.getElementById("tabs").hidden = true;
    document.getElementById("listTitle").textContent = "Indgang";
    document.getElementById("backLink").hidden = false;
  }

  // Altid ufiltreret, uafhængig af `onlyId` — ellers ville en enkelt
  // lore-side (permalink) ikke have nogen andre titler at linke til.
  async function loadLoreIndex() {
    const [{ data: loreData }, { data: charData }, { data: sessionData }] = await Promise.all([
      window.sb.from("lore_entries").select("id, title, category, body, relationship, status"),
      window.sb.from("characters").select("id, character_name, teaser"),
      window.sb.from("sessions").select("id, title, summary"),
    ]);
    loreIndex = [...(loreData || []), ...characterMentionEntries(charData), ...sessionMentionEntries(sessionData)];
    setLorePreviewData(loreIndex);
  }

  async function load() {
    let query = window.sb.from("lore_entries").select("*");
    query = onlyId ? query.eq("id", onlyId) : query.order("title", { ascending: true });
    const { data, error } = await query;
    if (error) {
      list.innerHTML = `<div class="empty">Kunne ikke hente lore: ${escapeHtml(error.message)}</div>`;
      return;
    }
    rowsCache = data || [];
    render();
  }

  function render() {
    if (onlyId) {
      if (!rowsCache.length) {
        list.innerHTML = `<div class="empty">Denne indgang findes ikke (mere). <a href="lore.html">Se al lore</a>.</div>`;
        return;
      }
      list.innerHTML = rowsCache.map(rowHtml).join("");
      rowsCache.forEach(wireRow);
      return;
    }
    const rows = activeCat === "all" ? rowsCache : rowsCache.filter((r) => r.category === activeCat);
    if (!rows.length) {
      list.innerHTML = `<div class="empty">Ingen indgange her endnu.</div>`;
      return;
    }
    list.innerHTML = rows.map(rowHtml).join("");
    rows.forEach(wireRow);
  }

  function rowHtml(l) {
    const bodyHtml = l.shop_data
      ? shopEntryHtml(l.shop_data)
      : `<div class="body">${linkifyLoreMentions(renderBodyHtml(l.body), loreIndex, l.id)}</div>`;
    const isNpc = l.category === "NPC";
    const attitudeBadge =
      isNpc && l.relationship
        ? `<span class="attitude ${ATTITUDE_CLASS[l.relationship] || ""}">${escapeHtml(l.relationship)}</span>`
        : "";
    const statusBadge =
      isNpc && l.status
        ? `<span class="status-badge ${STATUS_CLASS[l.status] || ""}">${escapeHtml(l.status)}</span>`
        : "";
    return `
      <div class="card" id="lore-${l.id}" data-id="${l.id}">
        <div class="view">
          <span class="badge">${escapeHtml(l.category)}</span>${attitudeBadge}${statusBadge}
          <h3 style="margin-top:8px;"><a href="lore.html?id=${l.id}">${escapeHtml(l.title)}</a></h3>
          ${bodyHtml}
          <p class="paste-hint" style="margin-top:10px;">${attributionLine(l)}</p>
          <div class="card-actions">
            <button class="btn secondary editBtn">Rediger</button>
            <button class="btn danger deleteBtn">Slet</button>
          </div>
        </div>
        <div class="edit" hidden>
          <form class="form editForm">
            <div class="row">
              <div class="field" style="flex:2;">
                <label>Titel</label>
                <input type="text" class="f-title" value="${escapeHtml(l.title)}" required>
              </div>
              <div class="field" style="max-width:200px;">
                <label>Kategori</label>
                <select class="f-category">
                  ${["NPC", "Faction", "Sted", "Begivenhed", "Genstand", "Butik", "Monster", "Besværgelse", "Andet"]
                    .map((c) => `<option value="${c}" ${c === l.category ? "selected" : ""}>${c}</option>`)
                    .join("")}
                </select>
              </div>
            </div>
            <div class="row f-npcFieldsRow" ${isNpc ? "" : "hidden"}>
              <div class="field" style="max-width:220px;">
                <label>Holdning</label>
                <select class="f-relationship">
                  ${["", "Fjendtlig", "Uvenlig", "Ligegyldig", "Venlig", "Hjælpsom"]
                    .map((v) => `<option value="${v}" ${v === (l.relationship || "") ? "selected" : ""}>${v || "Ikke sat"}</option>`)
                    .join("")}
                </select>
              </div>
              <div class="field" style="max-width:220px;">
                <label>Status</label>
                <select class="f-status">
                  ${["", "Levende", "Død", "Forsvundet", "Ukendt"]
                    .map((v) => `<option value="${v}" ${v === (l.status || "") ? "selected" : ""}>${v || "Ikke sat"}</option>`)
                    .join("")}
                </select>
              </div>
            </div>
            <div class="field">
              <label>Beskrivelse</label>
              <textarea class="f-body" required>${escapeHtml(l.body)}</textarea>
              <p class="paste-hint">Tip: klik i feltet og indsæt et billede med Ctrl+V &mdash; det lander der, hvor markøren står.</p>
            </div>
            <div class="card-actions">
              <button class="btn" type="submit">Gem</button>
              <button class="btn secondary cancelBtn" type="button">Annuller</button>
            </div>
          </form>
        </div>
      </div>`;
  }

  function wireRow(row) {
    const card = list.querySelector(`.card[data-id="${row.id}"]`);
    const viewEl = card.querySelector(".view");
    const editEl = card.querySelector(".edit");
    wireInlinePasteUpload(card.querySelector(".f-body"));

    const fCategory = card.querySelector(".f-category");
    const fNpcFieldsRow = card.querySelector(".f-npcFieldsRow");
    fCategory.addEventListener("change", () => {
      fNpcFieldsRow.hidden = fCategory.value !== "NPC";
    });

    card.querySelector(".editBtn").addEventListener("click", () => {
      viewEl.hidden = true;
      editEl.hidden = false;
    });
    card.querySelector(".cancelBtn").addEventListener("click", () => {
      viewEl.hidden = false;
      editEl.hidden = true;
    });
    card.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm(`Slet "${row.title}"?`)) return;
      await window.sb.from("lore_entries").delete().eq("id", row.id);
      load();
    });
    card.querySelector(".editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      await withBusy(submitBtn, "Gemmer…", async () => {
        const title = card.querySelector(".f-title").value.trim();
        const category = card.querySelector(".f-category").value;
        const body = card.querySelector(".f-body").value.trim();
        const isNpc = category === "NPC";
        const relationship = isNpc ? card.querySelector(".f-relationship").value || null : null;
        const status = isNpc ? card.querySelector(".f-status").value || null : null;
        await window.sb
          .from("lore_entries")
          .update({ title, category, body, relationship, status, updated_at: new Date().toISOString() })
          .eq("id", row.id);
        load();
      });
    });
  }

  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    activeCat = btn.dataset.cat;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === btn));
    render();
  });

  wireInlinePasteUpload(document.getElementById("body"));
  wireAuthorField(document.getElementById("author"));

  const categorySelect = document.getElementById("category");
  const npcFieldsRow = document.getElementById("npcFieldsRow");
  function updateNpcFieldsVisibility() {
    npcFieldsRow.hidden = categorySelect.value !== "NPC";
  }
  categorySelect.addEventListener("change", updateNpcFieldsVisibility);
  updateNpcFieldsVisibility();

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    await withBusy(submitBtn, "Gemmer…", async () => {
      const title = document.getElementById("title").value.trim();
      const category = document.getElementById("category").value;
      const body = document.getElementById("body").value.trim();
      const isNpc = category === "NPC";
      const relationship = isNpc ? document.getElementById("relationship").value || null : null;
      const status = isNpc ? document.getElementById("status").value || null : null;
      const author = document.getElementById("author").value.trim();
      const { error } = await window.sb.from("lore_entries").insert({
        title,
        category,
        body,
        relationship,
        status,
        created_by: author,
      });
      if (error) {
        alert("Kunne ikke gemme: " + error.message);
        return;
      }
      e.target.reset();
      document.getElementById("author").value = author;
      updateNpcFieldsVisibility();
      load();
    });
  });

  await loadLoreIndex();
  load();
})();
</script>
</body>
</html>
