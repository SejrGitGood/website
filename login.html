<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
<title>Log ind &middot; Blessings of Valkyriegade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="css/styles.css?v=8">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<main>
  <div class="wrap" style="max-width:420px;padding-top:10vh;">
    <div class="page-head" style="padding-top:0;">
      <p class="eyebrow">Blessings of Valkyriegade</p>
      <h1>Log ind</h1>
      <p>Én adgangskode, delt af hele selskabet.</p>
    </div>

    <div class="card">
      <form class="form" id="loginForm">
        <div class="field">
          <label for="password">Adgangskode</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit" id="loginBtn">Log ind</button>
      </form>
      <p class="notice" id="statusMsg" hidden style="margin-top:14px;"></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=1"></script>
<script>
  window.sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

  const params = new URLSearchParams(location.search);
  const redirectTarget = params.get("redirect") || "index.html";

  window.sb.auth.getSession().then(({ data }) => {
    if (data.session) location.href = redirectTarget;
  });

  const form = document.getElementById("loginForm");
  const statusMsg = document.getElementById("statusMsg");
  const loginBtn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    loginBtn.disabled = true;
    loginBtn.textContent = "Logger ind...";
    const { error } = await window.sb.auth.signInWithPassword({
      email: window.SUPABASE_CONFIG.sharedEmail,
      password,
    });
    if (error) {
      statusMsg.hidden = false;
      statusMsg.textContent = "Forkert adgangskode, eller kontoen er ikke sat op endnu.";
      loginBtn.disabled = false;
      loginBtn.textContent = "Log ind";
    } else {
      location.href = redirectTarget;
    }
  });
</script>
</body>
</html>
