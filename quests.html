<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
<title>Mål &middot; Blessings of Valkyriegade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="css/styles.css?v=13">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A6461C">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valkyriegade">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<nav class="site-nav" id="site-nav"></nav>

<main>
  <div class="page-head">
    <p class="eyebrow">Historien</p>
    <h1>Mål</h1>
    <p>Hvad selskabet er i gang med lige nu &mdash; adskilt fra Lore's opslagsværk.</p>
  </div>

  <div class="wrap" style="max-width:760px;">
    <p style="margin:-8px 0 4px;"><a href="historien.html" class="back-link">&larr; Historien</a></p>

    <section class="section" id="addSection">
      <div class="section-title"><h2>Nyt mål</h2></div>
      <div class="card">
        <form class="form" id="addForm">
          <div class="field">
            <label for="title">Mål</label>
            <input type="text" id="title" required placeholder="F.eks. Find Tarokka-kortene">
          </div>
          <div class="field">
            <label for="notes">Noter</label>
            <textarea id="notes" placeholder="Detaljer, ledetråde, hvem der ved hvad..."></textarea>
          </div>
          <button class="btn" type="submit">Gem</button>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Aktive mål</h2></div>
      <div id="activeList"><div class="empty">Indlæser&hellip;</div></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>Fuldførte mål</h2></div>
      <div id="doneList"></div>
    </section>
  </div>
</main>

<footer class="site-footer">Blessings of Valkyriegade &middot; skrevet af os, for os.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=1"></script>
<script src="js/app.js?v=15"></script>
<script>
(async function () {
  const session = await guardPage();
  if (!session) return;
  renderNav("historien.html");

  const activeList = document.getElementById("activeList");
  const doneList = document.getElementById("doneList");

  async function load() {
    const { data, error } = await window.sb.from("quests").select("*").order("created_at", { ascending: true });
    if (error) {
      activeList.innerHTML = `<div class="empty">Kunne ikke hente mål: ${escapeHtml(error.message)}</div>`;
      doneList.innerHTML = "";
      return;
    }
    const rows = data || [];
    const active = rows.filter((q) => !q.done);
    const done = rows.filter((q) => q.done);

    activeList.innerHTML = active.length
      ? active.map(questCardHtml).join("")
      : `<div class="empty">Ingen aktive mål lige nu.</div>`;
    doneList.innerHTML = done.length
      ? done.map(questCardHtml).join("")
      : `<div class="empty">Ingen fuldførte mål endnu.</div>`;

    rows.forEach(wireCard);
  }

  function questCardHtml(q) {
    return `
      <div class="card ${q.done ? "done" : ""}" id="quest-${q.id}" data-id="${q.id}">
        <div class="view">
          <h3>${escapeHtml(q.title)}</h3>
          ${q.notes ? `<p class="body">${escapeHtml(q.notes)}</p>` : ""}
          <div class="card-actions">
            <button class="btn secondary toggleBtn">${q.done ? "Genåbn" : "Marker fuldført"}</button>
            <button class="btn secondary editBtn">Rediger</button>
            <button class="btn danger deleteBtn">Slet</button>
          </div>
        </div>
        <div class="edit" hidden>
          <form class="form editForm">
            <div class="field">
              <label>Mål</label>
              <input type="text" class="f-title" value="${escapeHtml(q.title)}" required>
            </div>
            <div class="field">
              <label>Noter</label>
              <textarea class="f-notes">${escapeHtml(q.notes || "")}</textarea>
            </div>
            <div class="card-actions">
              <button class="btn" type="submit">Gem</button>
              <button class="btn secondary cancelBtn" type="button">Annuller</button>
            </div>
          </form>
        </div>
      </div>`;
  }

  function wireCard(row) {
    const card = document.getElementById(`quest-${row.id}`);
    if (!card) return;
    const viewEl = card.querySelector(".view");
    const editEl = card.querySelector(".edit");

    card.querySelector(".editBtn").addEventListener("click", () => {
      viewEl.hidden = true;
      editEl.hidden = false;
    });
    card.querySelector(".cancelBtn").addEventListener("click", () => {
      viewEl.hidden = false;
      editEl.hidden = true;
    });
    card.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm(`Slet "${row.title}"?`)) return;
      await window.sb.from("quests").delete().eq("id", row.id);
      load();
    });
    card.querySelector(".toggleBtn").addEventListener("click", async () => {
      await window.sb
        .from("quests")
        .update({ done: !row.done, updated_at: new Date().toISOString() })
        .eq("id", row.id);
      load();
    });
    card.querySelector(".editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      await withBusy(submitBtn, "Gemmer…", async () => {
        const title = card.querySelector(".f-title").value.trim();
        const notes = card.querySelector(".f-notes").value.trim();
        await window.sb
          .from("quests")
          .update({ title, notes, updated_at: new Date().toISOString() })
          .eq("id", row.id);
        load();
      });
    });
  }

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    await withBusy(submitBtn, "Gemmer…", async () => {
      const title = document.getElementById("title").value.trim();
      const notes = document.getElementById("notes").value.trim();
      const { error } = await window.sb.from("quests").insert({
        title,
        notes,
        created_by: session.user.email,
      });
      if (error) {
        alert("Kunne ikke gemme: " + error.message);
        return;
      }
      e.target.reset();
      load();
    });
  });

  load();
})();
</script>
</body>
</html>
