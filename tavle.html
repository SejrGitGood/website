<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
<title>Tavle &middot; Blessings of Valkyriegade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="css/styles.css?v=27">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17140F">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valkyriegade">
<!-- Tavlen står typisk på en skærm i et mørkt rum: altid mørkt tema (eller "blod", hvis det er valgt). -->
<script>try{var t=localStorage.getItem("theme");document.documentElement.dataset.theme=t==="blood"?"blood":"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
</head>
<body class="tavle">
<header class="tavle-top">
  <div class="tavle-time" id="timeLine"></div>
  <div class="tavle-tools">
    <button type="button" class="btn secondary" id="fullscreenBtn">Fuld skærm</button>
    <a href="ved-bordet.html" class="btn secondary tavle-back">&larr; Ved Bordet</a>
  </div>
</header>
<main class="tavle-main" id="board"><div class="empty">Indlæser&hellip;</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=2"></script>
<script src="js/app.js?v=24"></script>
<script>
(async function () {
  // app.js sætter brugerens eget tema, når den indlæses — Tavlen er altid mørk (eller "blod").
  document.documentElement.dataset.theme = getStoredTheme() === "blood" ? "blood" : "dark";
  const session = await guardPage();
  if (!session) return;

  const $ = (id) => document.getElementById(id);
  const state = { logistics: null, handout: null, encounter: null, combatants: [], characters: [], quests: [], log: [] };

  // --- Data ---
  async function loadLogistics() {
    const { data } = await window.sb.from("logistics").select("*").eq("id", 1).maybeSingle();
    state.logistics = data;
  }
  async function loadCombat() {
    // Kun det, spillerne må se (fight_board + fight_combatants, se app.js).
    const [fight, { data: chars }] = await Promise.all([
      loadActiveFight(),
      window.sb.from("characters").select("*").order("sort_order", { ascending: true }),
    ]);
    state.encounter = fight.encounter;
    state.combatants = fight.combatants;
    state.characters = chars || [];
  }
  async function loadIdle() {
    const [{ data: quests }, { data: log }] = await Promise.all([
      window.sb.from("quests").select("*").eq("done", false),
      window.sb.from("session_log_entries").select("*").is("session_id", null).order("created_at", { ascending: false }).limit(8),
    ]);
    state.quests = (quests || []).sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1));
    state.log = log || [];
  }

  // --- Tid på dagen øverst ---
  function renderTime() {
    const l = state.logistics;
    if (!l) {
      $("timeLine").textContent = "";
      return;
    }
    if (!("time_of_day" in l)) {
      $("timeLine").textContent = `Dag ${l.campaign_day || 1}`;
      return;
    }
    const p = phaseOf(l.time_of_day);
    $("timeLine").className = `tavle-time ${p.dark ? "dark" : ""}`;
    $("timeLine").innerHTML = `<span class="icon" aria-hidden="true">${p.icon}</span>${escapeHtml(timeOfDayText(l.campaign_day || 1, l.time_of_day))}`;
  }

  // --- Kamp: turrækkefølge, som spillerne må se den ---
  const charById = (id) => state.characters.find((c) => c.id === id);
  const isOut = (cb) => !!cb.is_out;
  function hpHtml(cb) {
    // Monstre: kun helbred i ord — tallene når aldrig hertil.
    if (cb.kind !== "pc") return cb.health ? `<span>${escapeHtml(cb.health)}</span>` : "";
    const c = cb.character_id ? charById(cb.character_id) : null;
    const synced = c && c.is_public && c.data && c.data.hp;
    const cur = synced ? c.data.hp.current : cb.hp_current;
    const max = synced ? c.data.hp.max : cb.hp_max;
    const temp = synced ? c.data.hp.temp || 0 : cb.hp_temp || 0;
    if (max == null) return "";
    if (cur <= 0) return `<span class="status-badge dead">Nede</span>`;
    const pct = max ? Math.max(0, Math.min(100, Math.round((cur / max) * 100))) : 0;
    const cls = pct <= 25 ? "critical" : pct <= 50 ? "wounded" : "";
    return `<span class="cb-hp-track"><span class="cb-hp-fill ${cls}" style="width:${pct}%;"></span></span><span>${cur}/${max}${temp ? ` (+${temp})` : ""}</span>`;
  }
  function condsHtml(cb, list) {
    const timers = cb.condition_timers || {};
    const chips = (cb.conditions || [])
      .map((k) => {
        const t = timers[k];
        const left = t ? Math.max(1, conditionRoundsLeft(t, list, state.encounter.round, state.encounter.turn_combatant_id)) : null;
        return `<span class="cond-chip ${t ? "timed" : ""}">${escapeHtml(k)}${left ? ` &middot; ${left} r.` : ""}</span>`;
      })
      .join("");
    return chips ? `<div class="cb-conds">${chips}</div>` : "";
  }
  function combatHtml() {
    const enc = state.encounter;
    const list = sortCombatants(state.combatants);
    const inRound = enc.round > 0;
    const idx = list.findIndex((c) => c.id === enc.turn_combatant_id);
    const current = inRound && idx !== -1 ? list[idx] : null;
    let next = null;
    for (let step = 1; current && step <= list.length; step++) {
      const c = list[(idx + step) % list.length];
      if (c && !isOut(c) && c.id !== current.id) {
        next = c;
        break;
      }
    }
    const rows = list
      .map((cb) => {
        const c = cb.kind === "pc" && cb.character_id ? charById(cb.character_id) : null;
        const avatar = c ? portraitHtml(c, escapeHtml(cb.name)) : `<span class="hp-portrait-fallback">${escapeHtml((cb.name || "?").charAt(0).toUpperCase())}</span>`;
        return `
        <div class="tavle-row ${current && cb.id === current.id ? "current" : ""} ${isOut(cb) ? "out" : ""}">
          <span class="tavle-init">${cb.initiative ?? "–"}</span>
          <span class="tavle-avatar">${avatar}</span>
          <span class="tavle-name">${escapeHtml(cb.name)}${condsHtml(cb, list)}</span>
          <span class="tavle-hp">${hpHtml(cb)}</span>
        </div>`;
      })
      .join("");
    return `
      <p class="tavle-round">${escapeHtml(enc.name)}${inRound ? ` &middot; Runde ${enc.round}` : ""}</p>
      <h1 class="tavle-now">${current ? escapeHtml(current.name) : inRound ? "" : "Slå initiativ"}</h1>
      ${next ? `<p class="tavle-round" style="margin:-8px 0 18px;">Næste: ${escapeHtml(next.name)}</p>` : ""}
      <div class="tavle-list">${rows || `<div class="empty">Ingen deltagere endnu.</div>`}</div>`;
  }

  // --- Når der ikke er kamp: selskabets helbred, mål og aftenens log ---
  function idleHtml() {
    const quests = state.quests.slice(0, 6);
    const log = state.log;
    return `
      <div class="tavle-idle">
        <div class="card"><h2>Selskabets helbred</h2>${hpWidgetHtml(state.characters)}</div>
        <div class="card"><h2>Aktive mål</h2>${
          quests.length
            ? `<ul class="shop-items">${quests.map((q) => `<li>${escapeHtml(q.title)}<span class="priority-badge ${PRIORITY_CLASS[q.priority] || "normal"}">${escapeHtml(q.priority || "Normal")}</span></li>`).join("")}</ul>`
            : `<p class="enc-meta">Ingen aktive mål.</p>`
        }</div>
        <div class="card"><h2>Aftenens log</h2>${
          log.length
            ? `<ul class="shop-items">${log
                .map((e) => `<li><span class="enc-meta">${new Date(e.created_at).toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" })}</span> ${escapeHtml(stripImageMarkdown(e.body))}</li>`)
                .join("")}</ul>`
            : `<p class="enc-meta">Ingen noter endnu i aften.</p>`
        }</div>
      </div>`;
  }

  function render() {
    renderTime();
    const h = state.handout;
    if (h) {
      $("board").innerHTML = `<div class="tavle-handout"><p class="eyebrow">Handout</p><h2>${escapeHtml(h.title)}</h2>${handoutContentHtml(h)}</div>`;
    } else if (state.encounter) {
      $("board").innerHTML = combatHtml();
    } else {
      $("board").innerHTML = idleHtml();
    }
  }

  // --- Fuld skærm, og hold skærmen vågen, så længe Tavlen er åben ---
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => (wakeLock = null));
      }
    } catch (e) {
      // Ikke understøttet eller afvist — Tavlen virker stadig.
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepAwake();
  });
  $("fullscreenBtn").addEventListener("click", async () => {
    keepAwake();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) {
      // F.eks. iPhone uden fuldskærms-API — siden kan stadig bruges som den er.
    }
  });
  document.addEventListener("fullscreenchange", () => {
    $("fullscreenBtn").textContent = document.fullscreenElement ? "Afslut fuld skærm" : "Fuld skærm";
  });

  await Promise.all([loadLogistics(), loadCombat(), loadIdle()]);
  await watchTableHandout(null, {
    popup: false,
    onChange: (h) => {
      state.handout = h;
      render();
    },
  });
  render();
  keepAwake();

  subscribeToChanges("tavle", [...FIGHT_TABLES, "logistics", "session_log_entries"], async () => {
    await Promise.all([loadLogistics(), loadCombat(), loadIdle()]);
    render();
  });
  // Mål er ikke med i Realtime — hentes jævnligt i stedet (og alt andet som en sikkerhed).
  setInterval(async () => {
    if (document.hidden) return;
    await Promise.all([loadLogistics(), loadCombat(), loadIdle()]);
    render();
  }, 30000);
})();
</script>
</body>
</html>
